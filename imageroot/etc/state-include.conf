#
# Module state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
#
# state/environment is always included automatically.

# Generated secrets: database password and bootstrap admin password
state/passwords.env
# Consistent PostgreSQL dump, created by bin/module-dump-state. The
# postgres-data volume is deliberately NOT included: live database files
# are not backup-consistent and the dump is the single source of truth.
state/keycloak.pg_dump
